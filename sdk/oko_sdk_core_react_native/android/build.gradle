plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}

group = 'com.okowallet'
version = '0.2.0'

android {
  namespace "com.okowallet.auth"
  compileSdk 34

  defaultConfig {
    minSdk 24
    targetSdk 34
    versionCode 1
    versionName "0.2.0"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation "com.facebook.react:react-android:+"
  api "androidx.browser:browser:1.9.0"
  api "androidx.activity:activity-ktx:1.10.1"
}
