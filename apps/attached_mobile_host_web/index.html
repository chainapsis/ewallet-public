<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oko Wallet</title>
    <style>
      :root {
        --mobile-host-bg: #f5f5f5;
        --mobile-host-text-primary: #111827;
        --mobile-host-text-secondary: #535862;
        --mobile-host-text-tertiary: #6b7280;
        --mobile-host-text-error: #b91c1c;
        --mobile-host-text-error-secondary: #7f1d1d;
        --mobile-host-spinner-track: #e5e7eb;
        --mobile-host-spinner-head: #111827;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: -apple-system, sans-serif;
        background: var(--mobile-host-bg);
        color: var(--mobile-host-text-secondary);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mobile-host-bg: #0c0e12;
          --mobile-host-text-primary: #f7f7f7;
          --mobile-host-text-secondary: #cecfd2;
          --mobile-host-text-tertiary: #94979c;
          --mobile-host-text-error: #fca5a5;
          --mobile-host-text-error-secondary: #fecaca;
          --mobile-host-spinner-track: #373a41;
          --mobile-host-spinner-head: #f7f7f7;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
